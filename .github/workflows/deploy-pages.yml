name: Deploy to GitHub Pages

# Veröffentlicht die statische Seite automatisch bei jedem Push auf main.
# Einmalig nötig: Repo-Einstellungen -> Pages -> "Build and deployment" ->
# Source auf "GitHub Actions" stellen.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Gleichzeitige Deployments vermeiden
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Baut kataloge/manifest.json automatisch aus den vorhandenen PDFs,
      # damit neue Kataloge ohne Code-Änderung erscheinen.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Die Katalogseiten werden hier einmal zu Bildern gerendert, damit die
      # Endgeraete das nicht mehr selbst tun muessen. Der Cache haengt an den
      # PDF-Dateien: Solange sich keine aendert, faellt das Rendern weg.
      - name: Werkzeuge fuer das Rendern installieren
        run: npm ci --prefix scripts

      - name: Gerenderte Katalogseiten wiederverwenden
        uses: actions/cache@v6
        with:
          path: kataloge/seiten
          key: katalogseiten-${{ hashFiles('kataloge/*.pdf') }}
          restore-keys: katalogseiten-

      - name: Katalogseiten als Bilder rendern
        run: node scripts/build-katalog-seiten.mjs

      - name: Katalog-Liste aus PDFs erzeugen
        run: node scripts/build-katalog-manifest.mjs

      # index.html und js/config.js aus content/site.json erzeugen. Damit
      # wirkt sich jede Aenderung aus dem Admin direkt auf die Live-Seite aus.
      - name: Seite aus content/site.json bauen
        run: node scripts/build-site.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # gesamtes Repo-Wurzelverzeichnis als Website hochladen
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
