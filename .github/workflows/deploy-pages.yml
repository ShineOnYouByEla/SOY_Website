name: Deploy to GitHub Pages

# Veröffentlicht die statische Seite automatisch bei jedem Push auf main.
# Einmalig nötig: Repo-Einstellungen -> Pages -> "Build and deployment" ->
# Source auf "GitHub Actions" stellen.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Gleichzeitige Deployments vermeiden
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # index.html und js/config.js aus content/site.json erzeugen. Damit
      # wirkt sich jede Aenderung aus dem Admin direkt auf die Live-Seite aus.
      - name: Seite aus content/site.json bauen
        run: node scripts/build-site.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # gesamtes Repo-Wurzelverzeichnis als Website hochladen
          path: "."
          # Seit v4 wirft die Action alles mit fuehrendem Punkt aus dem
          # Artefakt (`--exclude=.[^/]*`). Ohne diesen Schalter waeren
          # .well-known/ard.json und der Agent-Skills-Index nicht
          # ausgeliefert worden - der Deploy meldet trotzdem Erfolg, die
          # Adressen antworten aber mit 404. .git und .github bleiben in
          # jedem Fall draussen, darum ist das hier unbedenklich.
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
