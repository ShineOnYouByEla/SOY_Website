name: CI

# Qualitäts-Checks für jeden Pull Request (und main):
#  - HTML-Validierung aller Seiten
#  - JSON-LD (strukturierte Daten) auf gültiges JSON prüfen
#  - Interne Links/Dateiverweise prüfen
#  - Lighthouse (Performance, Accessibility, Best Practices, SEO)
#    mit Mindest-Scores, damit die Seite nicht schleichend langsamer wird

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: HTML, JSON-LD & Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # index.html entsteht aus content/site.json - erst bauen, dann pruefen.
      - name: Seite aus content/site.json bauen
        run: node scripts/build-site.mjs

      # Der Build darf nichts veraendern: sonst wurde index.html von Hand
      # angefasst statt ueber content/site.json bzw. den Admin.
      - name: Gebaute Dateien sind aktuell
        run: |
          git diff --exit-code -- index.html js/config.js || {
            echo "::error::index.html/js/config.js sind nicht aktuell. Bitte 'node scripts/build-site.mjs' ausfuehren und committen."
            exit 1
          }

      - name: HTML validieren
        run: npx --yes html-validate@9 "*.html"

      - name: Strukturierte Daten (JSON-LD) prüfen
        run: node scripts/check-jsonld.mjs

      - name: Interne Links prüfen
        run: node scripts/check-links.mjs

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Gleicher Schritt wie beim Deploy, damit katalog.html seine
      # Katalogliste findet und der Lauf der Live-Seite entspricht.
      - name: Katalog-Liste aus PDFs erzeugen
        run: node scripts/build-katalog-manifest.mjs

      - name: Seite aus content/site.json bauen
        run: node scripts/build-site.mjs

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
