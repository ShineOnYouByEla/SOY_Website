# ============================================================
# Shine On You — Admin-Backend, Variante MIT Build
#
# Nur brauchbar, wenn der Quellcode neben dem Compose-File liegt:
#   - lokal aus einem Klon:  docker compose -f backend/docker-compose.build.yml up -d
#   - Portainer-Stack vom Typ "Repository" (Portainer klont selbst)
#
# Für einen Stack aus dem Portainer-Web-Editor ist docker-compose.yml
# die richtige Datei – dort gibt es keinen Quellcode zum Bauen.
#
# Ansonsten identisch zu docker-compose.yml.
# ============================================================

services:
  soy-admin:
    build:
      # Repo-Wurzelverzeichnis: shared/ muss mit ins Image.
      context: ..
      dockerfile: backend/Dockerfile
    image: soy-admin:latest
    container_name: s-lx04-soy-admin
    environment:
      - TZ=Europe/Berlin
      # Adresse(n), unter denen das Admin aufgerufen wird – MIT Schema und Port.
      # Mehrere durch Komma trennen: im Heimnetz ist dasselbe Backend meist
      # sowohl per IP als auch per DNS-Name erreichbar, und beide Wege sollen
      # funktionieren. Was hier nicht steht, lehnt der CSRF-Schutz ab.
      - ADMIN_ORIGIN=http://admin.shineonyou.de:8080,http://192.168.178.13:8080
      # Ohne TLS im Heimnetz: das Secure-Flag am Cookie muss weg.
      - COOKIE_SECURE=false
      # Port im Container. Für eine Adresse ganz ohne Port (http://admin.shineonyou.de)
      # hier 80 eintragen und unten cap_add einkommentieren – der Container läuft
      # als normaler Nutzer und darf Ports unter 1024 sonst nicht belegen.
      - PORT=8080
      - GITHUB_REPO=ShineOnYouByEla/SOY_Website
      # Branch, aus dem gelesen und in den veröffentlicht wird. content/site.json
      # muss dort liegen – sonst meldet das Admin, die Datei sei nicht zu finden.
      - GITHUB_BRANCH=main
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - SITE_URL=https://shineonyou.de
      - PBKDF2_ITERATIONS=600000
      # Nur für die Ersteinrichtung auf true, danach zurückstellen.
      - SETUP_ENABLED=false
      - SETUP_TOKEN=${SETUP_TOKEN}
    # Nur nötig, wenn PORT unter 1024 liegt:
    # cap_add:
    #   - NET_BIND_SERVICE
    volumes:
      - soy-admin-data:/data
    networks:
      FritzNetz:
        ipv4_address: 192.168.178.13
        mac_address: 3A:42:5B:0D:11:13
    hostname: s-lx04-soy
    domainname: fritz.box
    dns:
      - 192.168.178.254
    healthcheck:
      # Shell-Form, damit ein geändertes PORT auch hier greift.
      test: ["CMD-SHELL", "wget -qO- \"http://127.0.0.1:${PORT:-8080}/api/ping\" >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: always

volumes:
  soy-admin-data:
    external: true

networks:
  FritzNetz:
    external: true
